name: Report remaining open issues
on:
  schedule:
    - cron: '20 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without changing issues
        type: boolean
        default: true

permissions: {}
concurrency:
  group: mission-control-reporting
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          script: |
            await require('./.github/scripts/reporting.cjs').issuesReport({github, context, core});
